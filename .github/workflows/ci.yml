name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Le paquet castLabs n'a pas de script d'installation : son moteur n'est téléchargé qu'au premier
  # require('electron'), ce que ni le lint ni les tests ne font. La variable est sans effet aujourd'hui ;
  # elle protège la CI si une version future téléchargeait le moteur dès l'installation.
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  lint:
    name: Lint et formatage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 : minimum annoncé par engines.node ; 24 : version majeure du Node d'Electron 44.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
